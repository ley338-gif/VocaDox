name: CI

env:
  NPM_VERSION: "11.19.1"
  UV_VERSION: "0.12.12"

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint / typecheck / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "uv==$UV_VERSION"
          uv sync --locked --extra dev

      - name: ruff
        run: uv run --locked --extra dev ruff check .

      - name: mypy
        run: uv run --locked --extra dev mypy app

      - name: pytest
        run: uv run --locked --extra dev pytest -q

      - name: pip-audit (Python dependency vulnerabilities)
        run: uv run --locked --extra dev pip-audit

  migration:
    name: Alembic migration (real Postgres)
    runs-on: ubuntu-latest
    # Phase 1 adds the first real domain tables (0002_identity_rbac). The
    # `backend` job above deliberately keeps using SQLite/fakes for
    # pytest (see tests/identity/conftest.py) so it needs no external
    # services — but the migration itself must still be proven against a
    # real Postgres, not just SQLite's more forgiving DDL. This job is
    # that proof, separate from `backend` so a Postgres-specific failure
    # here is never confused with an application-logic test failure.
    services:
      # Phase 11: kept in sync with deploy/compose.dev.yml's postgres
      # version (17.6) — see that file's comment for why (a real
      # backup/restore test surfaced a pg_dump/pg_restore client/server
      # major-version mismatch against 16.x).
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: vocadox
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: vocadox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocadox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      VOCADOX_DATABASE_URL: postgresql+asyncpg://vocadox:changeme@localhost:5432/vocadox
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "uv==$UV_VERSION"
          uv sync --locked --extra dev

      - name: alembic upgrade head (from empty database)
        run: uv run --locked --extra dev alembic upgrade head

      - name: alembic downgrade to base (proves downgrade() is not silently broken)
        run: uv run --locked --extra dev alembic downgrade base

      - name: alembic upgrade head again (proves the up/down/up cycle is clean)
        run: uv run --locked --extra dev alembic upgrade head

  real-infrastructure-golden-path:
    name: Golden path (real PostgreSQL + Valkey)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: vocadox
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: vocadox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocadox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8.0.2-alpine@sha256:752ba000a58bc8925d11ee863a39b5225617cd2cb3dbc9ec8ac65268b65ebb6d
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      VOCADOX_REAL_INFRA_TESTS: "1"
      VOCADOX_DATABASE_URL: postgresql+asyncpg://vocadox:changeme@localhost:5432/vocadox
      VOCADOX_VALKEY_URL: valkey://localhost:6379/0
      VOCADOX_MEDIA_STORAGE_ROOT: /tmp/vocadox-golden-path-media
      VOCADOX_UPLOAD_TEMP_DIR: /tmp/vocadox-golden-path-uploads
      VOCADOX_SPEECH_PROVIDER: fake
      VOCADOX_DIARIZATION_PROVIDER: fake
      VOCADOX_LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          pip install "uv==$UV_VERSION"
          uv sync --locked --extra dev

      - name: Migrate real database
        run: uv run --locked --extra dev alembic upgrade head

      - name: Run evidence-chain golden path
        run: uv run --locked --extra dev pytest -q tests/integration_real/test_golden_path.py

  gdt-bridge:
    name: GDT bridge (locked install / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectors/gdt-bridge
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          pip install "uv==$UV_VERSION"
          uv sync --locked --extra dev

      - name: pytest
        run: uv run --locked --extra dev pytest -q

  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm install -g "npm@$NPM_VERSION"
          npm ci

      - name: eslint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: vitest
        run: npm run test

      - name: build
        run: npm run build

      # `npm audit`'s classic "quick audit" endpoint has become unreliable
      # (npm's own CLI now prints "This endpoint is being retired. Use the
      # bulk advisory endpoint instead.") — observed hanging for 10+ minutes
      # then failing with transient registry errors (503, or a 400 "Invalid
      # package tree" that does not reproduce locally against the same
      # package-lock.json). Retried with a short per-attempt timeout so a
      # registry-side outage fails fast and retries instead of hanging the
      # whole job; a REAL high/critical vulnerability still fails the build
      # on the first attempt that successfully reaches the endpoint.
      - name: npm audit (Node dependency vulnerabilities)
        run: |
          for attempt in 1 2 3; do
            if timeout 120 npm audit --audit-level=high; then
              exit 0
            fi
            echo "npm audit attempt $attempt failed/timed out — retrying in 15s..." >&2
            sleep 15
          done
          echo "::error::npm audit failed after 3 attempts (see above for the last error)."
          exit 1

  browser-e2e:
    name: Browser golden path (Playwright / Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          npm install -g "npm@$NPM_VERSION"
          npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run evidence-chain browser journey
        run: npm run test:e2e

  openapi-client-drift:
    name: OpenAPI TS client drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: |
          pip install "uv==$UV_VERSION"
          uv sync --locked --extra dev

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install frontend
        working-directory: frontend
        run: |
          npm install -g "npm@$NPM_VERSION"
          npm ci

      - name: Start backend
        working-directory: backend
        run: |
          nohup uv run --locked --extra dev uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health/live && break
            sleep 1
          done

      - name: Fetch current openapi.json
        working-directory: frontend
        run: curl -sf http://127.0.0.1:8000/openapi.json -o openapi.json

      - name: Regenerate TS client
        working-directory: frontend
        run: npm run generate:api-client

      - name: Fail on drift
        run: |
          if ! git diff --quiet -- frontend/openapi.json frontend/src/api/generated; then
            echo "::error::Generated OpenAPI client is out of date. Run 'npm run generate:api-client' in frontend/ and commit the result."
            git diff -- frontend/openapi.json frontend/src/api/generated
            exit 1
          fi

  docker-build:
    name: Docker build (backend + frontend + AI worker + GDT bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t vocadox-backend:ci ./backend

      - name: Build frontend production image
        run: docker build --target runtime -t vocadox-frontend:ci ./frontend

      # Phase 3: the AI worker image (faster-whisper + pyannote.audio +
      # the pinned LGPL FFmpeg build) — CPU-only torch wheels, so this
      # build needs no GPU and stays usable in ordinary CI (spec:
      # "mandatory CI... must not depend on GPU").
      - name: Build AI worker image
        run: docker build -f backend/worker.Dockerfile -t vocadox-worker:ci ./backend

      - name: Build GDT bridge image
        run: docker build -t vocadox-gdt-bridge:ci ./connectors/gdt-bridge

      - name: Validate development compose config
        run: docker compose -f deploy/compose.dev.yml config --quiet

      - name: Validate production compose config
        env:
          POSTGRES_PASSWORD: 4af15f8e69d34aaf9d12f6074b812e21
          VOCADOX_BACKUP_PATH: /tmp/vocadox-backups
          VOCADOX_TLS_CERTIFICATE_PATH: /tmp/vocadox-tls/tls.crt
          VOCADOX_TLS_PRIVATE_KEY_PATH: /tmp/vocadox-tls/tls.key
        run: |
          docker compose -f deploy/compose.prod.yml config --format json > /tmp/vocadox-prod-compose.json
          jq -e '
            . as $doc
            | ([.services | to_entries[] | select(((.value.ports // []) | length) > 0) | .key]
                == ["reverse-proxy"])
            and (.networks.data.internal == true)
            and (.services.backend.environment.VOCADOX_ENVIRONMENT == "production")
            and (.services.backend.environment.VOCADOX_SESSION_COOKIE_SECURE == "true")
            and (.services.backend.environment.VOCADOX_DATABASE_ECHO == "false")
            and (["postgres", "valkey", "backend", "frontend"]
                | all(. as $name | (($doc.services[$name].ports // []) | length == 0)))
          ' /tmp/vocadox-prod-compose.json

      - name: Validate production reverse-proxy config
        run: |
          mkdir -p /tmp/vocadox-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" \
            -keyout /tmp/vocadox-tls/tls.key \
            -out /tmp/vocadox-tls/tls.crt
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            --mount "type=bind,source=$PWD/deploy/reverse-proxy/nginx.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=/tmp/vocadox-tls/tls.crt,target=/etc/nginx/tls/tls.crt,readonly" \
            --mount "type=bind,source=/tmp/vocadox-tls/tls.key,target=/etc/nginx/tls/tls.key,readonly" \
            nginx:1.31.3-alpine3.24@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752 \
            nginx -t

  compliance:
    name: License compliance (direct + full transitive tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install uv
        run: pip install "uv==$UV_VERSION"

      # Regenerate the transitive inventory from the ACTUAL resolved
      # trees on every run — never trust a possibly-stale committed copy.
      # Production-only Python tree (what backend/Dockerfile ships):
      - name: Resolve production Python dependency tree
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/prod_venv uv sync --project backend --locked --no-dev --no-editable

      # Full dev Python tree (adds ruff/mypy/pytest/pip-audit/pip-licenses):
      - name: Resolve full Python dev dependency tree
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/dev_venv uv sync --project backend --locked --extra dev
          /tmp/dev_venv/bin/pip-licenses --python /tmp/prod_venv/bin/python --format=json --with-urls > compliance/_raw_pip_prod_licenses.json
          /tmp/dev_venv/bin/pip-licenses --format=json --with-urls > compliance/_raw_pip_licenses.json

      # Phase 3 [ai] extra: the worker-speech/worker-diarization image's
      # package set (faster-whisper, pyannote.audio, torch, ...) — CPU-only
      # torch wheels, never installed in the api/frontend images. Scanned
      # separately (scope: worker in the output) so it's clear these
      # packages ship only in the AI worker images.
      - name: Resolve AI worker Python dependency tree
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/ai_venv uv sync --project backend --locked --no-dev --extra ai --no-editable
          /tmp/dev_venv/bin/pip-licenses --python /tmp/ai_venv/bin/python --format=json --with-urls > compliance/_raw_pip_ai_licenses.json

      # Node trees (production-only and full dev+prod):
      - name: Resolve Node dependency trees
        working-directory: frontend
        run: |
          npm install -g "npm@$NPM_VERSION"
          npm ci
          npx --no-install license-checker --production --json --excludePrivatePackages > ../compliance/_raw_npm_licenses_prod.json
          npx --no-install license-checker --json --excludePrivatePackages > ../compliance/_raw_npm_licenses_all.json

      - name: Regenerate dependency-inventory-transitive.yml
        run: |
          /tmp/dev_venv/bin/python compliance/generate_transitive_inventory.py \
            --pip-prod compliance/_raw_pip_prod_licenses.json \
            --pip-dev compliance/_raw_pip_licenses.json \
            --pip-ai compliance/_raw_pip_ai_licenses.json \
            --npm-prod compliance/_raw_npm_licenses_prod.json \
            --npm-all compliance/_raw_npm_licenses_all.json

      - name: Fail if the regenerated transitive inventory drifted from the committed one
        run: |
          if ! git diff --quiet -- compliance/dependency-inventory-transitive.yml; then
            echo "::error::compliance/dependency-inventory-transitive.yml is out of date. Regenerate it locally (see generate_transitive_inventory.py) and commit the result."
            git diff -- compliance/dependency-inventory-transitive.yml
            exit 1
          fi

      - name: Run license compliance check (direct + transitive + containers + models)
        run: /tmp/dev_venv/bin/python compliance/check_licenses.py

  container-vulnerability-scan:
    name: Container vulnerability scan (all shipped images + frontend build/dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image (shipped)
        run: docker build -t vocadox-backend:ci ./backend

      - name: Build frontend production image (shipped)
        run: docker build --target runtime -t vocadox-frontend:ci ./frontend

      - name: Build frontend build/dev image (not shipped, but scanned anyway — see ADR-0008)
        run: docker build --target dev -t vocadox-frontend-dev:ci ./frontend

      # Phase 3: the AI worker image is shipped (worker-speech/
      # worker-diarization) — spec: "Trivy on all shipped images (including
      # AI worker images)".
      - name: Build AI worker image (shipped)
        run: docker build -f backend/worker.Dockerfile -t vocadox-worker:ci ./backend

      - name: Build GDT bridge image (shipped connector)
        run: docker build -t vocadox-gdt-bridge:ci ./connectors/gdt-bridge

      # Trivy itself: Apache-2.0, license-checked (see
      # compliance/container-inventory.yml), pinned image, never installed
      # as a host binary.
      - name: Scan backend image — fail on any unresolved CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a \
            image --exit-code 1 --severity CRITICAL vocadox-backend:ci

      - name: Scan frontend runtime image — fail on any unresolved CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a \
            image --exit-code 1 --severity CRITICAL vocadox-frontend:ci

      - name: Scan frontend build/dev image — fail on any unresolved CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a \
            image --exit-code 1 --severity CRITICAL vocadox-frontend-dev:ci

      - name: Scan AI worker image — fail on any unresolved CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a \
            image --exit-code 1 --severity CRITICAL vocadox-worker:ci

      - name: Scan GDT bridge image — fail on any unresolved CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a \
            image --exit-code 1 --severity CRITICAL vocadox-gdt-bridge:ci

      - name: Report HIGH/MEDIUM/LOW findings (non-blocking, for visibility)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a \
            image --severity HIGH,MEDIUM,LOW vocadox-backend:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a \
            image --severity HIGH,MEDIUM,LOW vocadox-frontend:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a \
            image --severity HIGH,MEDIUM,LOW vocadox-frontend-dev:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a \
            image --severity HIGH,MEDIUM,LOW vocadox-worker:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a \
            image --severity HIGH,MEDIUM,LOW vocadox-gdt-bridge:ci
