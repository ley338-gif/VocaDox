name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint / typecheck / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy app

      - name: pytest
        run: pytest -q

  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: eslint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: vitest
        run: npm run test

      - name: build
        run: npm run build

  openapi-client-drift:
    name: OpenAPI TS client drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend
        working-directory: frontend
        run: npm ci || npm install

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health/live && break
            sleep 1
          done

      - name: Fetch current openapi.json
        working-directory: frontend
        run: curl -sf http://127.0.0.1:8000/openapi.json -o openapi.json

      - name: Regenerate TS client
        working-directory: frontend
        run: npm run generate:api-client

      - name: Fail on drift
        run: |
          if ! git diff --quiet -- frontend/openapi.json frontend/src/api/generated; then
            echo "::error::Generated OpenAPI client is out of date. Run 'npm run generate:api-client' in frontend/ and commit the result."
            git diff -- frontend/openapi.json frontend/src/api/generated
            exit 1
          fi

  docker-build:
    name: Docker build (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t vocadox-backend:ci ./backend

      - name: Build frontend production image
        run: docker build --target runtime -t vocadox-frontend:ci ./frontend

      - name: Validate compose config
        run: docker compose -f deploy/docker-compose.yml config --quiet

  compliance:
    name: License / container compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run license compliance check
        run: python compliance/check_licenses.py
