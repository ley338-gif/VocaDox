server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side router owns unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Same-origin API access (Phase 1): the SPA calls relative
    # `/api/v1/...` paths so the session cookie stays same-origin — no CORS
    # credential plumbing needed. "backend" resolves via the compose
    # network's internal DNS when this runtime image is deployed
    # alongside the backend service under that name; point this at the
    # actual backend host/port for other deployment topologies.
    #
    # The upstream is a variable (not a bare `proxy_pass http://backend:8000/`)
    # deliberately: nginx resolves a *literal* proxy_pass host once, at
    # config load, and refuses to start at all if it doesn't resolve yet —
    # verified locally (`nginx -t` fails with "host not found in upstream")
    # when this image is run standalone, outside the compose network.
    # Routing through a variable defers resolution to request time via the
    # `resolver` directive (Docker's embedded DNS), so nginx starts even if
    # the backend isn't up yet and serves a normal 502 instead of refusing
    # to boot.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream backend:8000;
        # No path component here deliberately: with a variable upstream,
        # nginx passes the original request URI through unmodified rather
        # than doing its usual location-prefix-for-proxy_pass-URI swap —
        # and the frontend/backend paths are identical (both `/api/v1/...`),
        # so passthrough is exactly what's wanted; a trailing `/api/` here
        # would double up to `/api/api/v1/...` and 404.
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
