# compliance/dependency-inventory.yml
#
# One entry per direct Phase 0 dependency. Licenses were looked up live
# against the PyPI JSON API (https://pypi.org/pypi/<pkg>/json) and the
# npm registry JSON API (https://registry.npmjs.org/<pkg>/latest) on
# 2026-08-17. Where PyPI's info.license / info.license_expression fields
# were empty, the classifiers and/or the project's canonical LICENSE file
# on GitHub were used as a fallback (noted per-entry).
#
# approval_status is computed against compliance/license-policy.yml.
#
# NOTE ON VERSIONS: license lookups below were performed against whatever
# the latest published version was at research time. `pyproject.toml` /
# `package.json` deliberately pin somewhat narrower, more conservative
# ranges for a few dev-tooling packages (mypy, pytest, pytest-asyncio) and
# for the frontend's major React/TypeScript/Vite/react-router/zod versions,
# for stability of this initial scaffold. `version_constraint` below has
# been corrected to match what is actually pinned and installed
# (`pip list` / `npm ls`, captured 2026-08-17) rather than left at the
# research-time "latest" figure — the recorded license is unaffected by
# this (all of these projects have used the same license across the
# versions in question).

dependencies:
  # ---------------------------------------------------------------------
  # Python (PyPI)
  # ---------------------------------------------------------------------
  - name: fastapi
    ecosystem: pypi
    version_constraint: ">=0.141,<0.142"
    license: MIT
    license_source_url: https://pypi.org/pypi/fastapi/json
    approval_status: approved
    notes: "info.license_expression = MIT (PyPI JSON, version 0.141.1)."

  - name: uvicorn
    ecosystem: pypi
    version_constraint: ">=0.52,<0.53"
    license: BSD-3-Clause
    license_source_url: https://pypi.org/pypi/uvicorn/json
    approval_status: approved
    notes: "info.license_expression = BSD-3-Clause (PyPI JSON, version 0.52.3)."

  - name: pydantic
    ecosystem: pypi
    version_constraint: ">=2.13,<3.0"
    license: MIT
    license_source_url: https://pypi.org/pypi/pydantic/json
    approval_status: approved
    notes: >
      PyPI JSON info.license and info.license_expression are both null for
      this release (version 2.13.4); no License :: classifier present
      either. Confirmed MIT via the project's canonical LICENSE file at
      https://raw.githubusercontent.com/pydantic/pydantic/main/LICENSE.

  - name: pydantic-settings
    ecosystem: pypi
    version_constraint: ">=2.4,<3.0 (installed: 2.15.0)"
    license: MIT
    license_source_url: https://pypi.org/pypi/pydantic-settings/json
    approval_status: approved
    notes: >
      Direct runtime dependency (used in app/platform/config.py) that was
      missing from this inventory until Phase 0's final closeout pass
      caught the gap during a version-accuracy sweep — added here rather
      than left untracked. info.license_expression = MIT (PyPI JSON).

  - name: sqlalchemy
    ecosystem: pypi
    version_constraint: ">=2.0,<2.1"
    license: MIT
    license_source_url: https://pypi.org/pypi/sqlalchemy/json
    approval_status: approved
    notes: "info.license = MIT (PyPI JSON, version 2.0.52)."

  - name: alembic
    ecosystem: pypi
    version_constraint: ">=1.19,<1.20"
    license: MIT
    license_source_url: https://pypi.org/pypi/alembic/json
    approval_status: approved
    notes: "info.license_expression = MIT (PyPI JSON, version 1.19.1)."

  - name: asyncpg
    ecosystem: pypi
    version_constraint: ">=0.31,<0.32"
    license: Apache-2.0
    license_source_url: https://pypi.org/pypi/asyncpg/json
    approval_status: approved
    notes: >
      Verified as requested: info.license_expression = Apache-2.0 (PyPI
      JSON, version 0.31.0), matching the expected Apache-2.0. Chosen over
      psycopg (LGPL-3.0, would land in review_required) for the async
      Postgres driver.

  - name: valkey
    ecosystem: pypi
    version_constraint: ">=6.1,<6.2"
    license: MIT
    license_source_url: https://pypi.org/pypi/valkey/json
    approval_status: approved
    notes: >
      Verified as requested rather than assumed: PyPI JSON reports
      info.license = "MIT" and classifier "License :: OSI Approved ::
      MIT License" (version 6.1.1). This is the valkey Python client
      library on PyPI; the Valkey server project itself (the Redis fork)
      is BSD-3-Clause. Since this dependency entry is the pip package, MIT
      is recorded here.

  - name: python-multipart
    ecosystem: pypi
    version_constraint: ">=0.0.32,<0.1"
    license: Apache-2.0
    license_source_url: https://pypi.org/pypi/python-multipart/json
    approval_status: approved
    notes: "info.license_expression = Apache-2.0, classifier 'License :: OSI Approved :: Apache Software License' (PyPI JSON, version 0.0.32)."

  - name: argon2-cffi
    ecosystem: pypi
    version_constraint: ">=23.1,<24.0 (installed: 23.1.0)"
    license: MIT
    license_source_url: https://pypi.org/pypi/argon2-cffi/json
    approval_status: approved
    notes: >
      info.license_expression = MIT (PyPI JSON, version 23.1.0). Added in
      Phase 1 for Argon2id password hashing (OWASP-recommended default),
      actively maintained (https://github.com/hynek/argon2-cffi). Its
      runtime transitive dependencies (argon2-cffi-bindings: MIT; cffi:
      MIT-0; pycparser: BSD-3-Clause) are all already-approved licenses —
      see dependency-inventory-transitive.yml.

  - name: ruff
    ecosystem: pypi
    version_constraint: ">=0.16,<0.17"
    license: MIT
    license_source_url: https://pypi.org/pypi/ruff/json
    approval_status: approved
    notes: "info.license_expression = MIT (PyPI JSON, version 0.16.3). Dev-only dependency."

  - name: mypy
    ecosystem: pypi
    version_constraint: ">=1.11,<2.0 (installed: 1.20.2)"
    license: MIT
    license_source_url: https://pypi.org/pypi/mypy/json
    approval_status: approved
    notes: "info.license_expression = MIT (PyPI JSON). Dev-only dependency. Pinned <2.0 in pyproject.toml for stability; license unchanged across the 1.x/2.x line."

  - name: pytest
    ecosystem: pypi
    version_constraint: ">=9.0.3,<10.0 (installed: 9.1.1)"
    license: MIT
    license_source_url: https://pypi.org/pypi/pytest/json
    approval_status: approved
    notes: >
      info.license_expression = MIT (PyPI JSON). Dev/test-only dependency.
      Upgraded from the <9.0 pin during Phase 0 remediation (2026-08-17)
      to fix PYSEC-2026-1845 / GHSA-6w46-j5rx-g56g (insecure /tmp/pytest-of-{user}
      tmpdir handling on UNIX — local-only DoS/privilege issue, found via
      pip-audit), patched at 9.0.3+. Verified: all 9 backend tests still
      pass on 9.1.1.

  - name: pytest-asyncio
    ecosystem: pypi
    version_constraint: ">=1.0,<2.0 (installed: 1.4.0)"
    license: Apache-2.0
    license_source_url: https://pypi.org/pypi/pytest-asyncio/json
    approval_status: approved
    notes: >
      info.license_expression = Apache-2.0 (PyPI JSON). Dev/test-only
      dependency. Upgraded from the 0.24-0.x pin during Phase 0
      remediation (2026-08-17) — required alongside the pytest 9.x
      upgrade above, since pytest-asyncio 0.26.0 pinned `pytest<9`.

  - name: setuptools
    ecosystem: pypi
    version_constraint: ">=83.0 (build-system requirement in pyproject.toml; installed: 84.0.0)"
    license: MIT
    license_source_url: https://pypi.org/pypi/setuptools/json
    approval_status: approved
    notes: >
      PEP 517 build-backend requirement, not a runtime dependency (not
      imported by the app; only used at package-build time, both for
      local dev installs and inside the backend's locked `uv sync` build
      step). Pinned >=83.0 during Phase 0 remediation (2026-08-17)
      to fix PYSEC-2026-3447 / GHSA-h35f-9h28-mq5c (Unicode-normalization
      MANIFEST.in exclude-pattern bypass on macOS APFS/HFS+ — irrelevant
      to our Linux Docker build in practice, but patched anyway since
      pip-audit flagged it). license = MIT per PyPI JSON.

  - name: pip-licenses
    ecosystem: pypi
    version_constraint: ">=5.5,<6.0 (installed: 5.5.5)"
    license: MIT
    license_source_url: https://pypi.org/pypi/pip-licenses/json
    approval_status: approved
    notes: >
      Build/compliance-tooling-only dependency, added during Phase 0
      remediation to generate compliance/dependency-inventory-transitive.yml
      from the real resolved dependency tree. Never imported by
      application code, never shipped in the backend Docker image (the
      Dockerfile performs a locked production sync without the dev extra).
      info.license_expression = MIT (PyPI JSON).

  - name: pip-audit
    ecosystem: pypi
    version_constraint: ">=2.10,<3.0 (installed: 2.10.1)"
    license: Apache-2.0
    license_source_url: https://pypi.org/pypi/pip-audit/json
    approval_status: approved
    notes: >
      Build/compliance-tooling-only dependency, added during Phase 0
      remediation to scan the Python dependency tree for known
      vulnerabilities (used in CI, see .github/workflows/ci.yml). Never
      shipped in the backend Docker image. Apache Software License
      classifier confirmed via PyPI JSON.

  - name: uv
    ecosystem: pypi
    version_constraint: "==0.12.12"
    license: MIT OR Apache-2.0
    license_source_url: https://github.com/astral-sh/uv
    approval_status: approved
    notes: >
      Locking/install tooling only. The executable is removed from runtime
      container layers after creating the application environment. The
      upstream repository offers MIT or Apache-2.0 at the user's option;
      both are approved by this policy.

  - name: license-checker
    ecosystem: npm
    version_constraint: "25.0.1"
    license: BSD-3-Clause
    license_source_url: https://registry.npmjs.org/license-checker/25.0.1
    approval_status: approved
    notes: >
      Build/compliance-tooling-only dependency, added during Phase 0
      remediation to generate the npm side of
      dependency-inventory-transitive.yml. It is pinned in package.json and
      package-lock.json so the compliance tree itself is reproducible, but
      remains a development-only tool and is invoked with `npx --no-install`.
      Never shipped in the frontend build output. license = BSD-3-Clause
      per npm registry.

  - name: httpx
    ecosystem: pypi
    version_constraint: ">=0.28,<0.29"
    license: BSD-3-Clause
    license_source_url: https://pypi.org/pypi/httpx/json
    approval_status: approved
    notes: >
      info.license = BSD-3-Clause (PyPI JSON, version 0.28.1). Originally a
      `[dev]`-only test dependency (httpx.AsyncClient/TestClient) and later
      also listed under the backend `[ai]` extra for the worker-extraction
      image. Moved into the core `dependencies` list (post-Phase-12 fix)
      because OllamaLLMProvider.status() (app/providers/llm.py) — the
      Admin LLM Provider page's live health check — runs in the `backend`
      API process itself, not only in the worker images; with httpx
      confined to `[ai]`, the backend process lacked it entirely and every
      status check failed with "Ollama server unreachable:
      ModuleNotFoundError" regardless of how the Ollama host was
      configured.

  - name: python-docx
    ecosystem: pypi
    version_constraint: ">=1.2,<2.0"
    license: MIT
    license_source_url: https://pypi.org/pypi/python-docx/json
    approval_status: approved
    notes: >
      info.license = MIT (PyPI JSON, version 1.2.0). Post-GA P0-2: DOCX
      export for Document/Recap (app/documents/export_formats.py). Runs in
      the `backend` API process (the export endpoint), no network calls.
      Depends on lxml (BSD-3-Clause, already approved) and
      typing-extensions (already a transitive dependency elsewhere).

  - name: reportlab
    ecosystem: pypi
    version_constraint: ">=5.0,<6.0"
    license: BSD-3-Clause
    license_source_url: https://pypi.org/pypi/reportlab/json
    approval_status: approved
    notes: >
      info.license = "BSD license (see license.txt for details)" (PyPI
      JSON, version 5.0.1); classifiers confirm "License :: OSI Approved
      :: BSD License". Post-GA P0-2: PDF export for Document/Recap
      (app/documents/export_formats.py). Pure-Python core, no native
      dependency, no network calls.

  - name: pillow
    ecosystem: pypi
    version_constraint: ">=12.3,<13.0"
    license: MIT-CMU
    license_source_url: https://pypi.org/pypi/pillow/json
    approval_status: approved
    notes: >
      info.license_expression = MIT-CMU (PyPI JSON, version 12.3.0).
      Production-readiness security hardening: fully decodes and normalizes
      avatar/letterhead PNG and JPEG uploads before browser serving or
      document rendering, enforcing pixel limits and stripping EXIF/GPS
      metadata. Pillow was already an approved transitive runtime dependency
      of reportlab; this records its new direct use explicitly.

  # Phase 4 note: Ollama itself (the local LLM inference server) was never
  # a Python dependency — it was a separate bundled container image (see
  # docs/architecture/adr/0024-llm-provider-selection.md for the original
  # runtime/model evaluation), removed from VocaDox's own shipped
  # container set entirely as of the Phase 12 GA-blocker fix (CVE-2026-56854
  # — see docs/architecture/adr/0029-remove-bundled-ollama.md and
  # container-inventory.yml's removal note). VocaDox now always talks to
  # an admin-managed external Ollama instance. CI's mandatory test suite
  # always runs against FakeLLMProvider regardless; httpx above is the
  # only new pypi package Phase 4 added and remains needed either way.

  # ---------------------------------------------------------------------
  # Node (npm)
  # ---------------------------------------------------------------------
  - name: react
    ecosystem: npm
    version_constraint: "^18.3.1 (installed: 18.3.1)"
    license: MIT
    license_source_url: https://registry.npmjs.org/react/latest
    approval_status: approved
    notes: "license = MIT (npm registry; verified against the latest published version, 19.2.8 at research time). Pinned to the 18.x line in package.json for stability; MIT throughout React's history."

  - name: react-dom
    ecosystem: npm
    version_constraint: "^18.3.1 (installed: 18.3.1)"
    license: MIT
    license_source_url: https://registry.npmjs.org/react-dom/latest
    approval_status: approved
    notes: "license = MIT (npm registry; verified against the latest published version, 19.2.8 at research time). Pinned to the 18.x line for stability alongside react."

  - name: react-router
    ecosystem: npm
    version_constraint: "^7.0.0 (installed: 7.18.2)"
    license: MIT
    license_source_url: https://registry.npmjs.org/react-router/latest
    approval_status: approved
    notes: "license = MIT (npm registry; verified against the latest published version, 8.3.0 at research time). Pinned to the 7.x line (unified react-router/react-router-dom package) for a well-documented, stable API surface."

  - name: "@tanstack/react-query"
    ecosystem: npm
    version_constraint: "^5.101.4"
    license: MIT
    license_source_url: https://registry.npmjs.org/@tanstack/react-query/latest
    approval_status: approved
    notes: "license = MIT (npm registry, version 5.101.4)."

  - name: zod
    ecosystem: npm
    version_constraint: "^3.23.8 (installed: 3.25.76)"
    license: MIT
    license_source_url: https://registry.npmjs.org/zod/latest
    approval_status: approved
    notes: "license = MIT (npm registry; verified against the latest published version, 4.4.3 at research time). Pinned to the 3.x line for API stability; MIT throughout."

  - name: vite
    ecosystem: npm
    version_constraint: "^7.3.6 (installed: 7.3.6)"
    license: MIT
    license_source_url: https://registry.npmjs.org/vite/latest
    approval_status: approved
    notes: >
      license = MIT (npm registry, version 7.3.6). Dev-only dependency.
      Upgraded from the 5.x line during Phase 0 remediation (2026-08-17)
      to resolve npm audit findings GHSA-4w7w-66w2-5vf9 (path traversal in
      optimized-deps .map handling), GHSA-fx2h-pf6j-xcff (server.fs.deny
      bypass on Windows), GHSA-v6wh-96g9-6wx3 (launch-editor NTLMv2 hash
      disclosure), and GHSA-g7r4-m6w7-qqqr (esbuild arbitrary file read on
      Windows dev server) — fixed as of 7.3.4+. Initially tried jumping
      straight to the 8.x line, but backed off: Vite 8 defaults to the
      new Rolldown bundler, whose optional native binary packages hit a
      known npm cross-platform-optional-dependency bug
      (npm/cli#4828 — lockfile generated on Windows failed to resolve the
      Linux native binding inside the Docker build). Vite 7.3.x still
      uses the previous (esbuild/rollup) bundler and has none of that
      friction, resolves the same CVEs, and required an
      `@vitejs/plugin-react` downgrade to 5.2.0 (its 6.x line requires
      vite ^8) — verified: lint, typecheck, all tests, `npm run build`,
      and the actual `docker build` (frontend Dockerfile `build`/`runtime`
      targets) all pass on this combination.

  - name: "@vitejs/plugin-react"
    ecosystem: npm
    version_constraint: "^5.2.0 (installed: 5.2.0)"
    license: MIT
    license_source_url: https://registry.npmjs.org/@vitejs/plugin-react/latest
    approval_status: approved
    notes: >
      license = MIT (npm registry). Dev-only dependency, not in the
      original Phase 0 dependency list but tracked here since Phase 0
      remediation (2026-08-17) explicitly pinned its version as part of
      the vite CVE fix (see the vite entry's notes above for why 5.2.0
      rather than the newer 6.x line, which requires vite ^8).

  - name: "@types/node"
    ecosystem: npm
    version_constraint: "^26.2.0"
    license: MIT
    license_source_url: https://registry.npmjs.org/@types/node/latest
    approval_status: approved
    notes: >
      license = MIT (npm registry, DefinitelyTyped). Added in Phase 1 so
      vite.config.ts's dev-server proxy config (process.env,
      process.cwd()) type-checks; type-declarations-only package, no
      runtime code, dev-only dependency.

  - name: typescript
    ecosystem: npm
    version_constraint: "^5.6.3 (installed: 5.9.3)"
    license: Apache-2.0
    license_source_url: https://registry.npmjs.org/typescript/latest
    approval_status: approved
    notes: "license = Apache-2.0 (npm registry; verified against the latest published version, 7.0.2 at research time). Pinned to the 5.x line for stability. Dev-only dependency."

  - name: eslint
    ecosystem: npm
    version_constraint: "^9.12.0 (installed: 9.39.5)"
    license: MIT
    license_source_url: https://registry.npmjs.org/eslint/latest
    approval_status: approved
    notes: "license = MIT (npm registry; verified against the latest published version, 10.8.1, at research time). Pinned to the 9.x line actually installed for stability; MIT throughout eslint's history. Dev-only dependency."

  - name: vitest
    ecosystem: npm
    version_constraint: "^4.1.10 (installed: 4.1.10)"
    license: MIT
    license_source_url: https://registry.npmjs.org/vitest/latest
    approval_status: approved
    notes: >
      license = MIT (npm registry, version 4.1.10). Dev/test-only
      dependency. Upgraded from the 2.x line during Phase 0 remediation
      (2026-08-17) to resolve npm audit finding GHSA-5xrq-8626-4rwp
      (CRITICAL — Vitest UI server allowed arbitrary file read/execute),
      fixed as of 3.2.6+; also required to match the vite 8.x upgrade
      above (vitest 2.x's transitive vite/esbuild pin was the actual root
      cause pulled in by npm audit). Verified: all tests still pass on
      4.1.10.

  - name: "@testing-library/react"
    ecosystem: npm
    version_constraint: "^16.3.2"
    license: MIT
    license_source_url: https://registry.npmjs.org/@testing-library/react/latest
    approval_status: approved
    notes: "license = MIT (npm registry, version 16.3.2). Dev/test-only dependency."

  - name: "@playwright/test"
    ecosystem: npm
    version_constraint: "1.63.0"
    license: Apache-2.0
    license_source_url: https://registry.npmjs.org/@playwright/test/1.63.0
    approval_status: approved
    notes: >
      license = Apache-2.0 (npm registry and bundled LICENSE, version
      1.63.0). Dev/test-only dependency used for the focused Phase 14
      Chromium golden path; neither the package nor browser binaries ship
      in VocaDox runtime images.

  - name: openapi-typescript
    ecosystem: npm
    version_constraint: "^7.13.0"
    license: MIT
    license_source_url: https://registry.npmjs.org/openapi-typescript/latest
    approval_status: approved
    notes: "license = MIT (npm registry, version 7.13.0). Dev/codegen-only dependency."

  - name: lucide-react
    ecosystem: npm
    version_constraint: "^0.451.0 (installed: 0.451.0)"
    license: ISC
    license_source_url: https://registry.npmjs.org/lucide-react/latest
    approval_status: approved
    notes: >
      Verified as requested: license = ISC (npm registry; verified against
      the latest published version, 1.31.0, at research time — matches the
      expected ISC). Pinned to the 0.x line actually installed for API
      stability; license unaffected. See also docs/licenses/fonts-assets.md
      for the Lucide icon-set project license.

  - name: "@fontsource/inter"
    ecosystem: npm
    version_constraint: "^5.3.0"
    license: OFL-1.1
    license_source_url: https://registry.npmjs.org/@fontsource/inter/latest
    approval_status: approved
    notes: >
      Verified as requested: license = OFL-1.1 (npm registry, version
      5.3.0), matching the expected OFL-1.1. This covers the npm
      packaging; the underlying Inter font itself is also licensed under
      the SIL Open Font License 1.1 by its author. See
      docs/licenses/fonts-assets.md.

  # ---------------------------------------------------------------------
  # Phase 3: real speech/diarization providers — worker-speech/
  # worker-diarization images ONLY (backend `[ai]` optional-dependency
  # extra, never installed in the api/frontend images or the mandatory
  # CI test suite). See docs/architecture/adr/0016-speech-provider-selection.md
  # and 0017-diarization-provider-selection.md for the full evaluation
  # (runtime library license verified separately from model-weight
  # license in each case).
  # ---------------------------------------------------------------------
  - name: faster-whisper
    ecosystem: pypi
    version_constraint: ">=1.0,<2.0"
    license: MIT
    license_source_url: https://pypi.org/pypi/faster-whisper/json
    approval_status: approved
    notes: >
      info.license = "MIT License" (PyPI JSON, 2026-08-18); classifiers
      confirm "License :: OSI Approved :: MIT License". Worker-image-only
      (backend `[ai]` extra) — never in the api/frontend images.

  - name: pyannote.audio
    ecosystem: pypi
    version_constraint: ">=4.0,<5.0"
    license: MIT
    license_source_url: https://raw.githubusercontent.com/pyannote/pyannote-audio/develop/LICENSE
    approval_status: approved
    notes: >
      PyPI publishes no license/license_expression field for this package;
      verified instead via the project's actual LICENSE file on GitHub
      (MIT, copyright CNRS 2020), 2026-08-18. Originally pinned to the
      lighter 3.x line; revised to 4.x after real testing found 3.x cannot
      actually be imported against a modern torchaudio (removed
      `torchaudio.AudioMetaData` API — see
      docs/architecture/adr/0017-diarization-provider-selection.md,
      "Version pin revised after real testing"). Worker-image-only
      (backend `[ai]` extra) — never in the api/frontend images. Every one
      of its own transitive dependencies (torch, lightning, opentelemetry,
      torchcodec, scipy, pandas, ...)
      is recorded in dependency-inventory-transitive.yml with
      scope: worker.

  - name: torch
    ecosystem: pypi
    version_constraint: ">=2.11,<3.0"
    license: Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND BSD-2-Clause AND BSD-3-Clause AND BSL-1.0 AND MIT
    license_source_url: https://github.com/pytorch/pytorch/blob/main/pyproject.toml
    approval_status: approved
    notes: >
      Worker-only direct declaration used to bind uv to PyTorch's official
      CPU wheel index. Every component of the upstream SPDX expression is
      permissive and already approved in license-policy.yml.

  - name: torchaudio
    ecosystem: pypi
    version_constraint: ">=2.11,<3.0"
    license: BSD-2-Clause
    license_source_url: https://github.com/pytorch/audio
    approval_status: approved
    notes: "Worker-only; official CPU wheel index. Upstream repository license verified."

  - name: torchcodec
    ecosystem: pypi
    version_constraint: ">=0.16,<1.0"
    license: BSD-3-Clause
    license_source_url: https://github.com/meta-pytorch/torchcodec/blob/main/LICENSE
    approval_status: approved
    notes: "Worker-only; official CPU wheel index. Upstream LICENSE verified."
