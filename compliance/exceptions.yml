# compliance/exceptions.yml
#
# Recorded exceptions to compliance/license-policy.yml — e.g. a
# review_required or blocked dependency that was explicitly approved for
# use despite its license bucket, with a documented reason and sign-off.
#
# Schema for each entry under `exceptions:`:
#   - dependency_name:  Name of the dependency (matching dependency-inventory.yml
#                        or model-inventory.yml) the exception applies to.
#     reason:            Why the exception is needed / why the dependency is
#                        used despite its license classification.
#     approved_by:       Person (name/handle) who approved the exception.
#     expiry_date:       Date the exception must be re-reviewed (ISO 8601),
#                        or "none" if it is considered permanent.
#     notes:             Any additional context, mitigations, or conditions
#                        attached to the exception.
#
# No exceptions have been needed for the direct dependencies in
# compliance/dependency-inventory.yml — every one resolved to "approved".
#
# Three exceptions are needed for the current transitive tree (see
# compliance/dependency-inventory-transitive.yml, generated by
# compliance/generate_transitive_inventory.py): certifi, pathspec, and tqdm.
# All contain MPL-2.0 and are used unmodified as ordinary dependencies.

exceptions:
  - dependency_name: certifi
    ecosystem: pypi
    reason: >
      TLS certificate bundle used transitively by HTTP clients in the API,
      worker, and development tooling. MPL-2.0 is file-level weak copyleft;
      VocaDox distributes certifi unmodified as a separate Python package,
      does not incorporate its source into proprietary files, and retains
      its license metadata. This does not require disclosure of VocaDox
      source code.
    approved_by: "Phase 0 remediation (automated compliance review)"
    expiry_date: "2027-08-17"
    notes: "Re-review if certifi is vendored, modified, or merged into another distributed file."

  - dependency_name: pathspec
    ecosystem: pypi
    reason: >
      Transitive dependency of mypy (used to parse .gitignore-style
      exclude patterns in mypy's own config resolution). Same rationale as
      certifi: unmodified, dev-tooling-only, never shipped in the backend
      Docker image or distributed to customers.
    approved_by: "Phase 0 remediation (automated compliance review)"
    expiry_date: "2027-08-17"
    notes: "Re-review if mypy or its dependency chain changes in a way that ships pathspec's code into a distributed artifact."

  - dependency_name: tqdm
    ecosystem: pypi
    reason: >
      Transitive worker dependency used unmodified as a separately installed
      Python package. Its reported license expression includes MPL-2.0 and
      MIT. File-level MPL obligations remain confined to tqdm itself and do
      not require disclosure of VocaDox source code; license metadata is
      retained in the worker environment.
    approved_by: "Phase 14 dependency reproducibility review"
    expiry_date: "2027-09-09"
    notes: "Re-review if tqdm is vendored, modified, or statically incorporated into VocaDox code."

# NOTE: an earlier draft of this remediation briefly upgraded the frontend
# to vite@8.2.1, which pulled in `lightningcss` (MPL-2.0, dev-only) as a
# transitive optional dependency and would have needed an exception entry
# here too. That attempt was abandoned — vite 8's default Rolldown bundler
# hit a known npm cross-platform-optional-dependency bug inside the Docker
# build (npm/cli#4828) — in favor of vite@7.3.6, which fixes the same CVEs
# without pulling in lightningcss/Rolldown at all. See the `vite` entry in
# dependency-inventory.yml for the full explanation. No lightningcss
# exception is needed on the current dependency tree.
