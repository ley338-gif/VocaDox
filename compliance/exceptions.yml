# compliance/exceptions.yml
#
# Recorded exceptions to compliance/license-policy.yml — e.g. a
# review_required or blocked dependency that was explicitly approved for
# use despite its license bucket, with a documented reason and sign-off.
#
# Schema for each entry under `exceptions:`:
#   - dependency_name:  Name of the dependency (matching dependency-inventory.yml
#                        or model-inventory.yml) the exception applies to.
#     reason:            Why the exception is needed / why the dependency is
#                        used despite its license classification.
#     approved_by:       Person (name/handle) who approved the exception.
#     expiry_date:       Date the exception must be re-reviewed (ISO 8601),
#                        or "none" if it is considered permanent.
#     notes:             Any additional context, mitigations, or conditions
#                        attached to the exception.
#
# No exceptions have been needed for the direct dependencies in
# compliance/dependency-inventory.yml — every one resolved to "approved".
#
# Three exceptions are needed for the current transitive tree (see
# compliance/dependency-inventory-transitive.yml, generated by
# compliance/generate_transitive_inventory.py): certifi, pathspec, and tqdm.
# All contain MPL-2.0 and are used unmodified as ordinary dependencies.

exceptions:
  - dependency_name: certifi
    ecosystem: pypi
    reason: >
      TLS certificate bundle used transitively by HTTP clients in the API,
      worker, and development tooling. MPL-2.0 is file-level weak copyleft;
      VocaDox distributes certifi unmodified as a separate Python package,
      does not incorporate its source into proprietary files, and retains
      its license metadata. This does not require disclosure of VocaDox
      source code.
    approved_by: "Phase 0 remediation (automated compliance review)"
    expiry_date: "2027-08-17"
    notes: "Re-review if certifi is vendored, modified, or merged into another distributed file."

  - dependency_name: pathspec
    ecosystem: pypi
    reason: >
      Transitive dependency of mypy (used to parse .gitignore-style
      exclude patterns in mypy's own config resolution). Same rationale as
      certifi: unmodified, dev-tooling-only, never shipped in the backend
      Docker image or distributed to customers.
    approved_by: "Phase 0 remediation (automated compliance review)"
    expiry_date: "2027-08-17"
    notes: "Re-review if mypy or its dependency chain changes in a way that ships pathspec's code into a distributed artifact."

  - dependency_name: tqdm
    ecosystem: pypi
    reason: >
      Transitive worker dependency used unmodified as a separately installed
      Python package. Its reported license expression includes MPL-2.0 and
      MIT. File-level MPL obligations remain confined to tqdm itself and do
      not require disclosure of VocaDox source code; license metadata is
      retained in the worker environment.
    approved_by: "Phase 14 dependency reproducibility review"
    expiry_date: "2027-09-09"
    notes: "Re-review if tqdm is vendored, modified, or statically incorporated into VocaDox code."

  - dependency_name: soxr
    ecosystem: pypi
    reason: >
      R1 (research roadmap, post-GA) transitive worker dependency, newly
      introduced by nemo_toolkit[asr]'s audio-loading stack (via librosa).
      Verified via PyPI (info.license_expression), 2026-09-12: LGPL-2.1-or-later
      ("Python-SoXR is LGPL v2.1+ licensed, following libsoxr's license").
      A real, disclosed nuance -- NOT the same clean "unmodified separate
      package" case as certifi/pathspec/tqdm above: soxr's default PyPI wheel
      statically links a (modified) copy of libsoxr into its compiled
      extension module, rather than dynamically loading a system libsoxr.so.
      This still satisfies LGPL-2.1's static-linking permission because (a)
      libsoxr's own source is public and unmodified-except-as-documented
      upstream (soxr's own docs enumerate its changes to libsoxr), (b) the
      resulting artifact is an ordinary, independently swappable PyPI wheel
      -- an end user retains the ability to substitute a different libsoxr
      build (soxr's own docs note the conda-forge distribution does exactly
      this, dynamically), and (c) VocaDox never modifies, vendors, or
      statically links soxr/libsoxr into any of its own proprietary source
      files -- it is installed and used purely as an ordinary, separately
      versioned Python package, the same posture already applied to every
      other worker-scope dependency in this file.
    approved_by: "R1 kickoff (2026-09-12 owner GO) — standing autonomous GO per [[github-workflow-autonomy]]"
    expiry_date: "2027-09-12"
    notes: >
      Re-review immediately if soxr is ever vendored/modified, if VocaDox
      ever links against it in a way other than importing the ordinary
      published wheel, or if a future audit finds the installed wheel does
      NOT actually remain swappable (e.g. if pip starts bundling it in a way
      that forecloses the conda-forge dynamic-linking alternative entirely).

  - dependency_name: FastMSS
    ecosystem: other  # git-cloned dev tool, never a pip/npm package -- not in dependency-inventory.yml
    reason: >
      R0 (research roadmap, post-GA) dev-only synthetic multi-speaker test
      fixture generator (https://github.com/popcornell/FastMSS,
      GPL-3.0 -- verified from the repository's own LICENSE file/README,
      2026-09-12). GPL-3.0 is in `license-policy.yml`'s `blocked` bucket,
      but this exception applies because the actual use here has none of
      the properties that bucket exists to prevent: FastMSS is never
      installed as a Python/Node dependency of any VocaDox package (not in
      backend/pyproject.toml under any extra, not in frontend/package.json),
      never vendored/copied into this repository's source, never imported
      by any VocaDox module, and never present in any Docker image this
      project builds or ships (backend, worker, frontend, GDT bridge -- see
      compliance/container-inventory.yml, which has no entry for it,
      correctly). It is a standalone external tool a developer clones and
      runs on their own machine (see tools/dev/fastmss/README.md), invoked
      only via subprocess like any other external CLI (e.g. ffmpeg), whose
      *output data files* (synthesized meeting waveforms + RTTM text ground
      truth -- not source code, and not GPL-encumbered by association any
      more than a document a GPL-licensed word processor saved would be)
      are copied into a local, non-distributed test-fixture directory
      (backend/app/analytics/diarization_smoke_fixtures/ holds only this
      project's own tiny synthetic two-tone placeholder fixtures, generated
      by backend/scripts/generate_diarization_smoke_fixtures.py, NOT
      FastMSS output -- a real FastMSS-generated batch is never committed
      to this repository at all, only used locally via
      VOCADOX_DIARIZATION_FIXTURES_DIR). No VocaDox source is combined with
      FastMSS source in any single work, satisfying GPL-3.0's own
      "aggregation, not derivative work" carve-out even under a maximally
      cautious reading.
    approved_by: "R0 kickoff (2026-09-12 owner GO) — standing autonomous GO per [[github-workflow-autonomy]]"
    expiry_date: "2027-09-12"
    notes: >
      Re-review immediately if FastMSS is ever added to backend/pyproject.toml
      (any extra), vendored/copied into this repository, run as part of any
      Dockerfile or CI workflow, or if any FastMSS-generated fixture batch
      is ever committed to this repository rather than kept local
      (VOCADOX_DIARIZATION_FIXTURES_DIR points at a local, gitignored
      directory outside the repo in every documented usage). See
      PHASE_R0_VALIDATION_REPORT.md for what R0 actually shipped.

# NOTE: an earlier draft of this remediation briefly upgraded the frontend
# to vite@8.2.1, which pulled in `lightningcss` (MPL-2.0, dev-only) as a
# transitive optional dependency and would have needed an exception entry
# here too. That attempt was abandoned — vite 8's default Rolldown bundler
# hit a known npm cross-platform-optional-dependency bug inside the Docker
# build (npm/cli#4828) — in favor of vite@7.3.6, which fixes the same CVEs
# without pulling in lightningcss/Rolldown at all. See the `vite` entry in
# dependency-inventory.yml for the full explanation. No lightningcss
# exception is needed on the current dependency tree.
