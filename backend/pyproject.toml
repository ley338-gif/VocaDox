[project]
name = "vocadox-backend"
version = "0.0.1"
description = "VocaDox backend — Evidence-based Conversation Documentation platform (Phase 0 scaffold)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "valkey>=6.0,<7.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    # pytest pinned >=9.0.3 (not <9.0 as originally scaffolded) to pick up
    # the fix for PYSEC-2026-1845/GHSA-6w46-j5rx-g56g (insecure tmpdir
    # handling on UNIX) found during Phase 0 remediation's pip-audit scan.
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "aiosqlite>=0.20,<1.0",
    # Build-only compliance tooling (never shipped in the app or its
    # Docker image) — see compliance/dependency-inventory-transitive.yml
    # for their own license entries.
    "pip-licenses>=5.5,<6.0",
    "pip-audit>=2.10,<3.0",
    # GitHub Actions' hosted Python includes an older preinstalled
    # setuptools (independent of [build-system].requires, which only
    # governs the isolated build env) that pip-audit flags — see
    # PYSEC-2026-3447/GHSA-h35f-9h28-mq5c. Pin it as a real dependency too
    # so `pip install -e .[dev]` actually upgrades what's on PATH.
    "setuptools>=83.0",
]

[build-system]
# setuptools pinned >=83.0 (not >=68 as originally scaffolded) to pick up
# the fix for PYSEC-2026-3447/GHSA-h35f-9h28-mq5c (Unicode-normalization
# MANIFEST.in exclude bypass) found during Phase 0 remediation's pip-audit
# scan. Irrelevant to our Linux Docker build in practice (the issue is
# macOS-filesystem-specific), but pinned above the fix anyway.
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = []

[tool.mypy]
python_version = "3.11"
packages = ["app"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
