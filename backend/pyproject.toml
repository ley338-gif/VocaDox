[project]
name = "vocadox-backend"
version = "0.14.0"
description = "VocaDox backend — on-premise, evidence-based conversation documentation"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "valkey>=6.0,<7.0",
    "python-multipart>=0.0.9",
    # Argon2id password hashing (OWASP-recommended default). MIT license —
    # see compliance/dependency-inventory.yml.
    "argon2-cffi>=23.1,<24.0",
    # BSD-3-Clause (verified: https://pypi.org/pypi/httpx/json) — HTTP client.
    # Used by OllamaLLMProvider (app/providers/llm.py), including its
    # status() health check called from the Admin LLM Provider page — that
    # endpoint runs in the `backend` API process, not just the worker
    # images, so httpx must be a core dependency, not confined to the `ai`
    # extra (a prior version of this file had it only under `ai`, which
    # made every backend-container Ollama status check fail with
    # "Ollama server unreachable: ModuleNotFoundError" regardless of how
    # correctly the Ollama host was configured).
    "httpx>=0.27,<1.0",
    # Post-GA P0-2: DOCX/PDF export for Document/Recap, no network calls,
    # both permissive-licensed (compliance/dependency-inventory.yml).
    "python-docx>=1.2,<2.0",
    "reportlab>=5.0,<6.0",
]
# NOTE on audio metadata extraction: `mutagen` was evaluated as a
# candidate for MP3/M4A/WebM duration/codec/sample-rate extraction and
# REJECTED — its actual PyPI-declared license is GPL-2.0-or-later (live
# lookup against https://pypi.org/pypi/mutagen/json, 2026-08-18; the
# initial assumption of "permissive" was wrong and caught by the license
# gate before merge, not after). GPL-2.0 is in the `blocked` bucket of
# compliance/license-policy.yml. Phase 2 therefore only extracts audio
# metadata for WAV (via the stdlib `wave` module — no dependency); MP3/M4A/
# WebM ship without duration/codec/sample-rate metadata for now. See
# app/media/metadata.py and docs/architecture/media-ingestion.md,
# "Known limitation: metadata extraction" for the honest scope of this.

[project.optional-dependencies]
# Phase 3 real speech/diarization providers — installed ONLY in the
# worker-speech/worker-diarization container images (see
# deploy/docker-compose.yml, deploy/worker.Dockerfile), never in the api/
# frontend images and never required by the mandatory (fake-provider) test
# suite. See docs/architecture/adr/0014-speech-provider-selection.md and
# 0015-diarization-provider-selection.md for the full license evaluation;
# compliance/dependency-inventory.yml records each direct package's
# license. Deliberately NOT part of `dependencies` above so `pip install
# -e backend/` (the CI/api image install) never pulls multi-GB ML
# packages.
ai = [
    # MIT (verified: https://pypi.org/pypi/faster-whisper/json) — CTranslate2-
    # based Whisper inference.
    "faster-whisper>=1.0,<2.0",
    # pyannote.audio 3.1+ is required by the pyannote/speaker-diarization-3.1
    # pipeline card. Originally pinned to the lighter 3.x line, but real
    # local testing (building backend/worker.Dockerfile and importing the
    # package) hit a genuine, documented upstream incompatibility: 3.x's
    # `pyannote/audio/core/io.py` calls `torchaudio.AudioMetaData`, which
    # newer torchaudio releases removed entirely (see
    # https://github.com/pyannote/pyannote-audio/issues/1952) — pyannote.audio
    # 3.x cannot actually be imported against a modern torchaudio resolved
    # by pip today. 4.x fixed this by moving to torchcodec instead of the
    # removed torchaudio API, so 4.x is what's pinned, despite its heavier
    # dependency footprint (see ADR-0017 for the full account of this
    # empirical finding, including the pin change). MIT (verified:
    # https://raw.githubusercontent.com/pyannote/pyannote-audio/develop/LICENSE).
    "pyannote.audio>=4.0,<5.0",
    # Declared directly so uv can bind every worker install to the official
    # CPU wheel index below. These are runtime requirements of pyannote's
    # audio stack, not dependencies of the API image.
    "torch>=2.11,<3.0",
    "torchaudio>=2.11,<3.0",
    "torchcodec>=0.16,<1.0",
]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    # pytest pinned >=9.0.3 (not <9.0 as originally scaffolded) to pick up
    # the fix for PYSEC-2026-1845/GHSA-6w46-j5rx-g56g (insecure tmpdir
    # handling on UNIX) found during Phase 0 remediation's pip-audit scan.
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "aiosqlite>=0.20,<1.0",
    # Build-only compliance tooling (never shipped in the app or its
    # Docker image) — see compliance/dependency-inventory-transitive.yml
    # for their own license entries.
    "pip-licenses>=5.5,<6.0",
    "pip-audit>=2.10,<3.0",
    # GitHub Actions' hosted Python includes an older preinstalled
    # setuptools (independent of [build-system].requires, which only
    # governs the isolated build env) that pip-audit flags — see
    # PYSEC-2026-3447/GHSA-h35f-9h28-mq5c. Pin it as a real dependency too
    # so the locked dev environment actually upgrades what's on PATH.
    "setuptools>=83.0",
]

[build-system]
# setuptools pinned >=83.0 (not >=68 as originally scaffolded) to pick up
# the fix for PYSEC-2026-3447/GHSA-h35f-9h28-mq5c (Unicode-normalization
# MANIFEST.in exclude bypass) found during Phase 0 remediation's pip-audit
# scan. Irrelevant to our Linux Docker build in practice (the issue is
# macOS-filesystem-specific), but pinned above the fix anyway.
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Keep developer machines, CI, and container builds on the same lockfile
# semantics. Update this together with uv.lock in a dedicated dependency PR.
required-version = "==0.12.12"

[[tool.uv.index]]
# The default worker image is deliberately CPU-only.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = []

# FastAPI's `Depends(...)`-as-default-value is the framework's documented
# dependency-injection idiom (Phase 1 introduces the first routers/deps
# that use it) — not the mutable-default-argument bug B008 exists to catch.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
