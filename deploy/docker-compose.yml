# VocaDox development compose stack.
#
# Phase 3 adds worker-speech/worker-diarization (see
# docs/architecture/adr/0020-worker-topology.md): both build from the same
# backend/worker.Dockerfile image but run with a different --role, so they
# can later get independent GPU allocations without a Dockerfile change.
# Neither the `backend` (api) nor `frontend` service ever gets GPU device
# access — only the AI workers do (spec: "GPU isolation"); the api stays
# fully functional (serving everything except newly-queued processing)
# even if both workers are stopped. The frontend service runs the Vite DEV
# server — this is intentional for local development only; the production
# image (frontend/Dockerfile `runtime` target) serves static assets via
# nginx and never runs the dev server. See frontend/Dockerfile and
# README.md.
#
# All image tags below are pinned to a specific version (never `latest`);
# see ../compliance/container-inventory.yml for the license/digest record.
#
# GPU: uncomment each worker's `deploy.resources.reservations.devices`
# block to grant NVIDIA GPU access via the NVIDIA Container Toolkit (see
# docs/operations/gpu-runtime.md). Left commented by default so
# `docker compose up` works unmodified on a CPU-only host — workers then
# fall back to CPU inference (see docs/admin/gpu-setup.md's honest CPU
# real-time-factor numbers).

services:
  # Phase 11: bumped 16.6 -> 17.6 to match the `postgresql-client` package
  # Debian trixie's apt repo actually ships (17.x) — found via a REAL
  # restore-into-fresh-infrastructure test: pg_dump 17.x (from the
  # backend image's postgresql-client) emits `SET transaction_timeout =
  # 0;` in its custom-format dump header (a GUC introduced in Postgres
  # 17), which a 16.x server's pg_restore rejects with "unrecognized
  # configuration parameter" — a real client/server major-version
  # mismatch, not a hypothetical one. Matching the server to the client
  # trixie ships is simpler and lower-risk than pinning postgresql-client
  # to 16.x via the third-party apt.postgresql.org repository (extra
  # supply-chain trust) or copying cross-distro binaries (fragile shared
  # library ABI assumptions) — see PHASE_11_VALIDATION_REPORT.md, Restore.
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vocadox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-vocadox}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vocadox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocadox}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.0.2-alpine@sha256:752ba000a58bc8925d11ee863a39b5225617cd2cb3dbc9ec8ac65268b65ebb6d
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - vocadox_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 3.1: deterministic migration lifecycle (Postgres -> migrations ->
  # application -> bootstrap admin). A real fresh/local install previously
  # let `backend`/the workers start against a database with NO Alembic
  # revision at all — `python -m app.identity.bootstrap_admin` then failed
  # with `asyncpg.exceptions.UndefinedTableError: relation "permissions"
  # does not exist` because nothing had ever run `alembic upgrade head`.
  # This one-shot service runs the migration exactly once per `docker
  # compose up`, before anything that touches the schema starts, instead
  # of every API replica racing to run its own migration on boot (which
  # would risk concurrent-DDL failures under >1 backend replica) or
  # relying on an administrator to remember a manual `docker compose exec
  # backend alembic upgrade head` step (the exact gap that caused the
  # bug). `restart: "no"` + no `command` re-run on `docker compose up`
  # after the first successful run — Compose still executes this service's
  # container on every `up`, but `alembic upgrade head` is itself
  # idempotent (a no-op against an already-current database), so this is
  # safe and cheap to run every time, not just on first install.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      VOCADOX_ENVIRONMENT: ${VOCADOX_ENVIRONMENT:-development}
      VOCADOX_LOG_LEVEL: ${VOCADOX_LOG_LEVEL:-INFO}
      VOCADOX_LOG_FORMAT: ${VOCADOX_LOG_FORMAT:-json}
      VOCADOX_DATABASE_URL: ${VOCADOX_DATABASE_URL:-postgresql+asyncpg://vocadox:changeme@postgres:5432/vocadox}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      VOCADOX_ENVIRONMENT: ${VOCADOX_ENVIRONMENT:-development}
      VOCADOX_LOG_LEVEL: ${VOCADOX_LOG_LEVEL:-INFO}
      VOCADOX_LOG_FORMAT: ${VOCADOX_LOG_FORMAT:-json}
      VOCADOX_DATABASE_URL: ${VOCADOX_DATABASE_URL:-postgresql+asyncpg://vocadox:changeme@postgres:5432/vocadox}
      VOCADOX_VALKEY_URL: ${VOCADOX_VALKEY_URL:-valkey://valkey:6379/0}
      VOCADOX_CORS_ALLOW_ORIGINS: ${VOCADOX_CORS_ALLOW_ORIGINS:-["http://localhost:5173"]}
      # Plain-HTTP local dev stack (no TLS termination here) — the `Secure`
      # cookie flag would otherwise stop the browser from storing/sending
      # the session cookie at all. A real deployment sits behind TLS and
      # must leave this at its secure-by-default `true`.
      VOCADOX_SESSION_COOKIE_SECURE: ${VOCADOX_SESSION_COOKIE_SECURE:-false}
      # api never loads a real speech/diarization provider itself (it only
      # enqueues jobs) — kept at the safe "fake" default here regardless;
      # only the worker services below set these to the real providers.
      # Phase 11: separate volume from media/model storage (ADR-0018's
      # "don't mix storage purposes" principle applied a third time) —
      # backups must never live on the same volume as the data they back
      # up, so a `docker compose down -v` (or any single-volume failure)
      # can't take both out at once in a real deployment. This IS the same
      # single Docker host in local dev, though — see
      # docs/operations/disaster-recovery.md for the real-deployment
      # off-host recommendation.
      VOCADOX_BACKUP_ROOT: /app/backups
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Phase 2: media_storage_root (./data/media) and upload_temp_dir
      # (./data/tmp-uploads) both live under /app/data — a named volume so
      # ingested conversation audio survives container recreation, not
      # just an in-place restart (verified as part of the Phase 2
      # restart-persistence validation).
      - vocadox_backend_data:/app/data
      - vocadox_backups_data:/app/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker-speech:
    build:
      context: ../backend
      dockerfile: worker.Dockerfile
    command: ["--role", "speech"]
    environment:
      VOCADOX_ENVIRONMENT: ${VOCADOX_ENVIRONMENT:-development}
      VOCADOX_LOG_LEVEL: ${VOCADOX_LOG_LEVEL:-INFO}
      VOCADOX_LOG_FORMAT: ${VOCADOX_LOG_FORMAT:-json}
      VOCADOX_DATABASE_URL: ${VOCADOX_DATABASE_URL:-postgresql+asyncpg://vocadox:changeme@postgres:5432/vocadox}
      VOCADOX_VALKEY_URL: ${VOCADOX_VALKEY_URL:-valkey://valkey:6379/0}
      # "fake" by default so `docker compose up` never silently tries to
      # load a multi-GB model that hasn't been explicitly installed (spec:
      # "no silent internet access from workers in production" / "No model
      # not installed -> show 'Not installed', never a fake 'Healthy'").
      # Set to faster_whisper after running the model-install step (see
      # docs/admin/model-installation.md).
      VOCADOX_SPEECH_PROVIDER: ${VOCADOX_SPEECH_PROVIDER:-fake}
      VOCADOX_SPEECH_DEVICE: ${VOCADOX_SPEECH_DEVICE:-auto}
      VOCADOX_MODEL_VOLUME_ROOT: /app/data/models
    volumes:
      - vocadox_backend_data:/app/data
      - vocadox_models_data:/app/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  worker-diarization:
    build:
      context: ../backend
      dockerfile: worker.Dockerfile
    command: ["--role", "diarization"]
    environment:
      VOCADOX_ENVIRONMENT: ${VOCADOX_ENVIRONMENT:-development}
      VOCADOX_LOG_LEVEL: ${VOCADOX_LOG_LEVEL:-INFO}
      VOCADOX_LOG_FORMAT: ${VOCADOX_LOG_FORMAT:-json}
      VOCADOX_DATABASE_URL: ${VOCADOX_DATABASE_URL:-postgresql+asyncpg://vocadox:changeme@postgres:5432/vocadox}
      VOCADOX_VALKEY_URL: ${VOCADOX_VALKEY_URL:-valkey://valkey:6379/0}
      VOCADOX_DIARIZATION_PROVIDER: ${VOCADOX_DIARIZATION_PROVIDER:-fake}
      VOCADOX_DIARIZATION_DEVICE: ${VOCADOX_DIARIZATION_DEVICE:-auto}
      VOCADOX_MODEL_VOLUME_ROOT: /app/data/models
      # Only ever read by the admin-initiated `vocadox models install` CLI
      # step, never by the running worker process itself at request time.
      VOCADOX_HUGGINGFACE_TOKEN: ${VOCADOX_HUGGINGFACE_TOKEN:-}
    volumes:
      - vocadox_backend_data:/app/data
      - vocadox_models_data:/app/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Phase 4: local LLM inference server for fact extraction (see
  # docs/admin/llm-provider.md and
  # docs/architecture/adr/0024-llm-provider-selection.md). Never a
  # cloud/hosted LLM endpoint — conversation content stays inside this
  # compose network. Not pre-loaded with any model: an admin pulls one
  # explicitly (`docker compose exec ollama ollama pull qwen2.5:14b`),
  # matching the Phase 3 "no silent multi-GB downloads" policy for
  # speech/diarization models. Only this container ever gets GPU access
  # for LLM inference — worker-extraction talks to it over plain HTTP and
  # needs no GPU itself.
  ollama:
    image: ollama/ollama:0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - vocadox_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  worker-extraction:
    build:
      context: ../backend
      dockerfile: worker.Dockerfile
    command: ["--role", "extraction"]
    environment:
      VOCADOX_ENVIRONMENT: ${VOCADOX_ENVIRONMENT:-development}
      VOCADOX_LOG_LEVEL: ${VOCADOX_LOG_LEVEL:-INFO}
      VOCADOX_LOG_FORMAT: ${VOCADOX_LOG_FORMAT:-json}
      VOCADOX_DATABASE_URL: ${VOCADOX_DATABASE_URL:-postgresql+asyncpg://vocadox:changeme@postgres:5432/vocadox}
      VOCADOX_VALKEY_URL: ${VOCADOX_VALKEY_URL:-valkey://valkey:6379/0}
      # "fake" by default, same policy as speech/diarization — set to
      # "ollama" only once a model has actually been pulled into the
      # `ollama` service (see docs/admin/llm-provider.md).
      VOCADOX_LLM_PROVIDER: ${VOCADOX_LLM_PROVIDER:-fake}
      VOCADOX_LLM_BASE_URL: ${VOCADOX_LLM_BASE_URL:-http://ollama:11434}
      VOCADOX_LLM_MODEL: ${VOCADOX_LLM_MODEL:-qwen2.5:14b}
    volumes:
      - vocadox_backend_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Phase 3.1: the administrator-facing model-installation command. Not
  # started by a plain `docker compose up` (the `tools` profile keeps it
  # out of the default service set — nothing "up" needs it running) —
  # invoked directly instead:
  #
  #   docker compose run --rm model-manager list
  #   docker compose run --rm model-manager install speech-default
  #   docker compose run --rm -e VOCADOX_HUGGINGFACE_TOKEN=<token> \
  #       model-manager install diarization-default
  #
  # See docs/admin/model-installation.md. Fixes the Phase 3 bug where the
  # documented command against `worker-diarization` failed with "the
  # following arguments are required: --role" — see
  # backend/app/cli/model_manager.py's docstring for the exact root cause
  # (worker.Dockerfile's ENTRYPOINT swallowing the intended command).
  # Shares the same image and model volume as the workers (so a model
  # installed here is immediately visible to worker-speech/
  # worker-diarization without a rebuild) but needs neither Postgres nor
  # Valkey — this is a pure filesystem/network operation.
  model-manager:
    profiles: ["tools"]
    build:
      context: ../backend
      dockerfile: worker.Dockerfile
    entrypoint: ["python", "-m", "app.cli.model_manager"]
    command: ["list"]
    environment:
      VOCADOX_MODEL_VOLUME_ROOT: /app/data/models
      # Only ever read for the duration of this one-shot `run` — never
      # baked into the image, never persisted, never logged (see
      # backend/app/cli/install_models.py and docs/security/model-supply-chain.md).
      VOCADOX_HUGGINGFACE_TOKEN: ${VOCADOX_HUGGINGFACE_TOKEN:-}
    volumes:
      - vocadox_models_data:/app/data/models

  # Phase 11: admin-facing backup/restore CLI (see
  # backend/app/cli/backup.py and docs/operations/disaster-recovery.md).
  # `create`/`list` also exist as HTTP endpoints
  # (POST/GET /admin/operations/backups); `restore` is CLI-only —
  # deliberately not a button, see app.operations.backup_service's module
  # docstring for why.
  #
  #   docker compose run --rm backup create
  #   docker compose run --rm backup list
  #   docker compose run --rm backup restore <backup_id>
  #
  # Uses the `backend` image (has postgresql-client — see
  # backend/Dockerfile) rather than the worker image; needs neither GPU
  # nor ffmpeg.
  backup:
    profiles: ["tools"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "app.cli.backup"]
    command: ["list"]
    environment:
      VOCADOX_DATABASE_URL: ${VOCADOX_DATABASE_URL:-postgresql+asyncpg://vocadox:changeme@postgres:5432/vocadox}
      VOCADOX_BACKUP_ROOT: /app/backups
    volumes:
      - vocadox_backend_data:/app/data
      - vocadox_backups_data:/app/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Phase 11: the automated Retention Cleanup Worker (see
  # backend/app/cli/retention_cleanup.py). Dry-run by default — pass
  # `--execute` for REAL, IRREVERSIBLE deletion:
  #
  #   docker compose run --rm retention-cleanup run
  #   docker compose run --rm retention-cleanup run --execute
  #
  # Intended to also be invoked on a schedule (host cron/k8s CronJob)
  # independent of the admin UI.
  retention-cleanup:
    profiles: ["tools"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "app.cli.retention_cleanup"]
    command: ["run"]
    environment:
      VOCADOX_DATABASE_URL: ${VOCADOX_DATABASE_URL:-postgresql+asyncpg://vocadox:changeme@postgres:5432/vocadox}
    volumes:
      - vocadox_backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      # Vite dev server proxy target (see frontend/vite.config.ts) —
      # "backend" resolves via the compose network's internal DNS.
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  vocadox_postgres_data:
  vocadox_valkey_data:
  vocadox_backend_data:
  # Phase 11: Backup/Restore artifacts (pg_dump + media tar per backup),
  # deliberately separate from vocadox_backend_data (conversation media)
  # and vocadox_models_data (installed AI models) — see the `backend`
  # service's VOCADOX_BACKUP_ROOT comment above.
  vocadox_backups_data:
  # Persistent model volume, deliberately separate from
  # vocadox_backend_data (conversation media) — see
  # docs/architecture/adr/0018-model-installation-strategy.md. Never
  # re-downloaded on `docker compose restart`/`up` (models persist here
  # across container recreation, only `down -v` clears them).
  vocadox_models_data:
  # Ollama's own model-weight storage (Phase 4) — separate from
  # vocadox_models_data (the Phase 3 speech/diarization model volume) since
  # Ollama manages its own storage layout under /root/.ollama. Same
  # warning applies: never re-downloaded on `docker compose restart`/`up`,
  # only `down -v` clears it (see docs/admin/llm-provider.md).
  vocadox_ollama_data:
