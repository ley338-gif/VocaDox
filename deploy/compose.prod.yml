# VocaDox production compose stack.
#
# Only the TLS reverse proxy publishes host ports. PostgreSQL, Valkey, the
# backend, and the frontend remain on private Compose networks. Copy
# production.env.example to a protected environment file and follow
# docs/operations/production-deployment.md before starting this stack.

x-app-environment: &app-environment
  VOCADOX_ENVIRONMENT: production
  VOCADOX_LOG_LEVEL: ${VOCADOX_LOG_LEVEL:-INFO}
  VOCADOX_LOG_FORMAT: ${VOCADOX_LOG_FORMAT:-json}
  VOCADOX_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-vocadox}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vocadox}"
  VOCADOX_VALKEY_URL: valkey://valkey:6379/0
  # Same-origin browser requests need no CORS grant. Add only explicit HTTPS
  # origins for separately hosted trusted clients.
  # A production-specific input name prevents Compose's automatic loading of a
  # repository-root development .env from leaking its localhost CORS grant.
  VOCADOX_CORS_ALLOW_ORIGINS: ${VOCADOX_PRODUCTION_CORS_ALLOW_ORIGINS:-[]}
  VOCADOX_SESSION_COOKIE_SECURE: "true"
  VOCADOX_DATABASE_ECHO: "false"
  VOCADOX_MEDIA_STORAGE_ROOT: /app/data/media
  VOCADOX_UPLOAD_TEMP_DIR: /app/data/tmp-uploads
  VOCADOX_BACKUP_ROOT: /app/backups

services:
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vocadox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vocadox}
    volumes:
      - vocadox_postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocadox} -d ${POSTGRES_DB:-vocadox}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:8.0.2-alpine@sha256:752ba000a58bc8925d11ee863a39b5225617cd2cb3dbc9ec8ac65268b65ebb6d
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - vocadox_valkey_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  config-check:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-c", "from app.platform.config import get_settings; get_settings(); print('Production configuration is valid.')"]
    environment: *app-environment
    restart: "no"
    networks: [data]

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    restart: "no"
    networks: [data]
    depends_on:
      config-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    restart: unless-stopped
    environment:
      <<: *app-environment
      VOCADOX_SPEECH_PROVIDER: ${VOCADOX_SPEECH_PROVIDER:-fake}
      VOCADOX_SPEECH_DEVICE: ${VOCADOX_SPEECH_DEVICE:-auto}
      VOCADOX_DIARIZATION_PROVIDER: ${VOCADOX_DIARIZATION_PROVIDER:-fake}
      VOCADOX_DIARIZATION_DEVICE: ${VOCADOX_DIARIZATION_DEVICE:-auto}
      VOCADOX_LLM_PROVIDER: ${VOCADOX_LLM_PROVIDER:-fake}
      VOCADOX_LLM_BASE_URL: ${VOCADOX_LLM_BASE_URL:-}
      VOCADOX_LLM_MODEL: ${VOCADOX_LLM_MODEL:-qwen2.5:14b}
      VOCADOX_MODEL_VOLUME_ROOT: /app/data/models
    volumes:
      - vocadox_backend_data:/app/data
      - ${VOCADOX_BACKUP_PATH:?Set an absolute VOCADOX_BACKUP_PATH}:/app/backups
      - vocadox_models_data:/app/data/models:ro
    networks: [edge, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker-speech:
    build:
      context: ../backend
      dockerfile: worker.Dockerfile
    command: ["--role", "speech"]
    restart: unless-stopped
    environment:
      <<: *app-environment
      VOCADOX_SPEECH_PROVIDER: ${VOCADOX_SPEECH_PROVIDER:-fake}
      VOCADOX_SPEECH_DEVICE: ${VOCADOX_SPEECH_DEVICE:-auto}
      VOCADOX_MODEL_VOLUME_ROOT: /app/data/models
    volumes:
      - vocadox_backend_data:/app/data
      - vocadox_models_data:/app/data/models:ro
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  worker-diarization:
    build:
      context: ../backend
      dockerfile: worker.Dockerfile
    command: ["--role", "diarization"]
    restart: unless-stopped
    environment:
      <<: *app-environment
      VOCADOX_DIARIZATION_PROVIDER: ${VOCADOX_DIARIZATION_PROVIDER:-fake}
      VOCADOX_DIARIZATION_DEVICE: ${VOCADOX_DIARIZATION_DEVICE:-auto}
      VOCADOX_MODEL_VOLUME_ROOT: /app/data/models
    volumes:
      - vocadox_backend_data:/app/data
      - vocadox_models_data:/app/data/models:ro
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  worker-extraction:
    build:
      context: ../backend
      dockerfile: worker.Dockerfile
    command: ["--role", "extraction"]
    restart: unless-stopped
    environment:
      <<: *app-environment
      VOCADOX_LLM_PROVIDER: ${VOCADOX_LLM_PROVIDER:-fake}
      VOCADOX_LLM_BASE_URL: ${VOCADOX_LLM_BASE_URL:-}
      VOCADOX_LLM_MODEL: ${VOCADOX_LLM_MODEL:-qwen2.5:14b}
    volumes:
      - vocadox_backend_data:/app/data
    networks: [data, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  reverse-proxy:
    image: nginx:1.31.3-alpine3.24@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${VOCADOX_TLS_CERTIFICATE_PATH:?Set VOCADOX_TLS_CERTIFICATE_PATH}:/etc/nginx/tls/tls.crt:ro
      - ${VOCADOX_TLS_PRIVATE_KEY_PATH:?Set VOCADOX_TLS_PRIVATE_KEY_PATH}:/etc/nginx/tls/tls.key:ro
    networks: [edge]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  model-manager:
    profiles: ["tools"]
    build:
      context: ../backend
      dockerfile: worker.Dockerfile
    entrypoint: ["python", "-m", "app.cli.model_manager"]
    command: ["list"]
    environment:
      VOCADOX_MODEL_VOLUME_ROOT: /app/data/models
      VOCADOX_HUGGINGFACE_TOKEN: ${VOCADOX_HUGGINGFACE_TOKEN:-}
    volumes:
      - vocadox_models_data:/app/data/models
    networks: [data, egress]

  backup:
    profiles: ["tools"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "app.cli.backup"]
    command: ["list"]
    environment: *app-environment
    volumes:
      - vocadox_backend_data:/app/data
      - ${VOCADOX_BACKUP_PATH:?Set an absolute VOCADOX_BACKUP_PATH}:/app/backups
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  retention-cleanup:
    profiles: ["tools"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "app.cli.retention_cleanup"]
    command: ["run"]
    environment: *app-environment
    volumes:
      - vocadox_backend_data:/app/data
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
  data:
    internal: true
  # Only services that deliberately contact an administrator-selected local
  # provider or download models join this outbound-capable network.
  egress:

volumes:
  vocadox_postgres_data:
  vocadox_valkey_data:
  vocadox_backend_data:
  vocadox_models_data:
